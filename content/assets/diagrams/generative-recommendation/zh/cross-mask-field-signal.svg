<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">推荐的序列信号比文本多一维</title>
  <desc id="diagram-desc">文本只有「序列 × 表示」，推荐还有「特征域」，cross-mask 正是为这一维设计的</desc>
  <defs>
