<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="848" viewBox="0 0 1400 848" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">三段链路，同一种改写</title>
  <desc id="diagram-desc">召回、粗精排与重排的短板都来自判别式形式本身，因此可以用同一种方式替换</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="832" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="832" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="118" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="113" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="113" dy="0">生成式推荐</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">三段链路，同一种改写</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">召回、粗精排与重排的短板都来自判别式形式本身，因此可以用同一种方式替换</tspan></text>

    <g>
    <rect x="35" y="180" width="1330" height="170" rx="26" fill="#ffffff" stroke="#0f766e" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="35" y="180" width="1330" height="52" rx="26" fill="#0f766e" fill-opacity=".1"/>
    <rect x="35" y="206" width="1330" height="26" fill="#0f766e" fill-opacity=".1"/>
    <text x="59" y="213" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="59" dy="0">召回</tspan></text>
    <text x="1341" y="213" text-anchor="end" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#5e6b7f" opacity="1"><tspan x="1341" dy="0">生成对象：视频的语义 ID</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="238" width="470" height="100" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="238" width="8" height="100" rx="4" fill="#dc4c64"/>

    <text x="98" y="281" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="98" dy="0">索引决定了交叉能力的上限</tspan></text>
    <text x="98" y="304" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="98" dy="0">为了能建索引，交叉只能放在顶层内积</tspan><tspan x="98" dy="18">近邻检索有折损，结果趋同，价值口径与后链路不同</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 556 288 L 626 288" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 556 288 L 626 288" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="646" y="238" width="694" height="100" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="646" y="238" width="8" height="100" rx="4" fill="#0f766e"/>

    <text x="674" y="281" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="674" dy="0">自回归生成 / 扩散还原</tspan></text>
    <text x="674" y="304" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="674" dy="0">直接生成 token 序列，不再需要近邻索引</tspan><tspan x="674" dy="18">可做全负例训练，检索与排序共用同一套目标</tspan></text>
  </g>
    <g>
    <rect x="35" y="365" width="1330" height="170" rx="26" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="35" y="365" width="1330" height="52" rx="26" fill="#4f46e5" fill-opacity=".1"/>
    <rect x="35" y="391" width="1330" height="26" fill="#4f46e5" fill-opacity=".1"/>
    <text x="59" y="398" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="59" dy="0">粗精排</tspan></text>
    <text x="1341" y="398" text-anchor="end" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#5e6b7f" opacity="1"><tspan x="1341" dy="0">生成对象：目标视频的多目标打分</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="423" width="470" height="100" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="423" width="8" height="100" rx="4" fill="#dc4c64"/>

    <text x="98" y="466" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="98" dy="0">两阶段序列与手工交叉结构</tspan></text>
    <text x="98" y="489" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="98" dy="0">剪枝丢信息，只刻画目标与历史的相似度</tspan><tspan x="98" dy="18">Dense 交叉靠启发式结构，参数放大后收益停滞</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 556 473 L 626 473" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 556 473 L 626 473" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="646" y="423" width="694" height="100" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="646" y="423" width="8" height="100" rx="4" fill="#4f46e5"/>

    <text x="674" y="466" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="674" dy="0">端到端长序列 + 可放大的 Dense</tspan></text>
    <text x="674" y="489" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="674" dy="0">Cross-mask 直接建模多特征域的 3D 序列信号</tspan><tspan x="674" dy="18">正交化更新解开梯度坍缩，Dense 得以继续 Scaling</tspan></text>
  </g>
    <g>
    <rect x="35" y="550" width="1330" height="170" rx="26" fill="#ffffff" stroke="#d97706" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="35" y="550" width="1330" height="52" rx="26" fill="#d97706" fill-opacity=".1"/>
    <rect x="35" y="576" width="1330" height="26" fill="#d97706" fill-opacity=".1"/>
    <text x="59" y="583" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#d97706" opacity="1"><tspan x="59" dy="0">重排</tspan></text>
    <text x="1341" y="583" text-anchor="end" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#5e6b7f" opacity="1"><tspan x="1341" dy="0">生成对象：整条曝光序列</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="608" width="470" height="100" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="608" width="8" height="100" rx="4" fill="#dc4c64"/>

    <text x="98" y="651" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="98" dy="0">多通道漏斗与规则化拼装</tspan></text>
    <text x="98" y="674" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="98" dy="0">数十条生成通道各自为战，规则决定最终拼装</tspan><tspan x="98" dy="18">候选只有数十量级，评估退化成一个标量</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 556 658 L 626 658" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 556 658 L 626 658" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="646" y="608" width="694" height="100" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="646" y="608" width="8" height="100" rx="4" fill="#d97706"/>

    <text x="674" y="651" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="674" dy="0">统一自回归生成 + 复杂评估</tspan></text>
    <text x="674" y="674" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="674" dy="0">一个模型生成整条序列，强化学习优化整体价值</tspan><tspan x="674" dy="18">候选覆盖精排全量，奖励扩展到多窗口多行为</tspan></text>
  </g>
    <text x="700" y="752" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="650" fill="#5e6b7f" opacity="1"><tspan x="700" dy="0">三处短板都不是调参问题：损失来自「先检索、再打分、再拼装」这一形式</tspan></text>
    <g>
    <rect x="45" y="772" width="415" height="46" rx="23" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="252.5" y="799.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="252.5" dy="0">统一价值口径</tspan></text>
  </g>
    <g>
    <rect x="492" y="772" width="415" height="46" rx="23" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="699.5" y="799.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="699.5" dy="0">端到端信息通路</tspan></text>
  </g>
    <g>
    <rect x="939" y="772" width="415" height="46" rx="23" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28"/>
    <text x="1146.5" y="799.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#d97706" opacity="1"><tspan x="1146.5" dy="0">用算力换建模能力</tspan></text>
  </g>

</svg>
