    <text x="428" y="519" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="428" dy="0">集合生成：生成单位从序列升到集合</tspan></text>
    <text x="428" y="542" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="428" dy="0">每步把候选序列压成向量，彼此感知后再展开</tspan><tspan x="428" dy="18">通道级奖励强化整体胜出的集合</tspan></text>
  </g>

