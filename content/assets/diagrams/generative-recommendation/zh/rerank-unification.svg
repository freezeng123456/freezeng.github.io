    <rect x="1010" y="180" width="355" height="52" rx="26" fill="#0f766e" fill-opacity=".1"/>
    <rect x="1010" y="206" width="355" height="26" fill="#0f766e" fill-opacity=".1"/>
    <text x="1034" y="213" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="1034" dy="0">可扩展的评估系统</tspan></text>

  </g>
