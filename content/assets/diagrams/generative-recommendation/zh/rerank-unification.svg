    <text x="428" y="405" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="428" dy="0">指令跟随：把线上策略写进输入</tspan></text>
    <text x="428" y="428" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="428" dy="0">规则压成四元组〈起点，窗口，下限，上限〉</tspan><tspan x="428" dy="18">公式项连同超参一起输入，对改动泛化</tspan></text>
  </g>
