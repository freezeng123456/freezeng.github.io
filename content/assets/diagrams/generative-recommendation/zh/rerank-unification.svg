    <text x="428" y="291" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="428" dy="0">强化学习：优化整条序列的价值</tspan></text>
    <text x="428" y="314" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="428" dy="0">评估打分落盘成奖励，先按排名归一化</tspan><tspan x="428" dy="18">组内优势 + 梯度截断 + 序列级重要性采样</tspan></text>
  </g>
    <g filter="url(#shadow)">
