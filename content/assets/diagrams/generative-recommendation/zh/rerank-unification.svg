  </g>
    <g>
    <rect x="58" y="248" width="244" height="40" rx="20" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="180" y="272.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="180" dy="0">生成通道 1</tspan></text>
  </g>
    <g>
    <rect x="58" y="296" width="244" height="40" rx="20" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="180" y="320.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="180" dy="0">生成通道 2</tspan></text>
  </g>
    <g>
    <rect x="58" y="344" width="244" height="40" rx="20" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="180" y="368.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="180" dy="0">…… 数十条通道</tspan></text>
  </g>
