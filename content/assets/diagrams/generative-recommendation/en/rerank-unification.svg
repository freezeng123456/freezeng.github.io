    <text x="365" y="767.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#d97706" opacity="1"><tspan x="365" dy="0">Forward: candidates cover the full ranking pool, so the funnel disappears</tspan></text>
