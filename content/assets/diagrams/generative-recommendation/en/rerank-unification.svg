    <text x="1034" y="213" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="1034" dy="0">Scalable evaluation</tspan></text>

  </g>
    <g>
    <rect x="1032" y="250" width="311" height="44" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="1187.5" y="276.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e" opacity="1"><tspan x="1187.5" dy="0">Windows: instant · session · long-term</tspan></text>
  </g>
    <g>
    <rect x="1032" y="306" width="311" height="44" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="1187.5" y="332.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb" opacity="1"><tspan x="1187.5" dy="0">Operators: sum · max · min</tspan></text>
  </g>
    <g>
    <rect x="1032" y="362" width="311" height="44" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28"/>
    <text x="1187.5" y="388.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#16865b" opacity="1"><tspan x="1187.5" dy="0">Behaviours: dwell · interaction · exit</tspan></text>
  </g>
    <text x="1187" y="436" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#5e6b7f" opacity="1"><tspan x="1187" dy="0">Their product forms the list-level reward</tspan></text>
