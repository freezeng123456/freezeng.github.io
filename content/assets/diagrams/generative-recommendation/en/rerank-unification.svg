    <text x="399" y="213" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="399" dy="0">Unified autoregressive generator</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="400" y="248" width="540" height="100" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="400" y="248" width="8" height="100" rx="4" fill="#2563eb"/>

    <text x="428" y="291" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="428" dy="0">RL: optimise the value of the whole list</tspan></text>
    <text x="428" y="314" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="428" dy="0">Served scores are logged and rank-normalised</tspan><tspan x="428" dy="18">Group advantage, clipped gradients, sequence ratios</tspan></text>
  </g>
    <g filter="url(#shadow)">
