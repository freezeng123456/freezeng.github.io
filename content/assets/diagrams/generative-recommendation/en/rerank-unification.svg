    <text x="428" y="405" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="428" dy="0">Instructions: policies enter the input</tspan></text>
    <text x="428" y="428" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="428" dy="0">Rules compress to start, window, floor, ceiling</tspan><tspan x="428" dy="18">Formula terms arrive with their hyper-parameters</tspan></text>
  </g>
    <g filter="url(#shadow)">
