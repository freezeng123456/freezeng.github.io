    <text x="930" y="712" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13.5" font-weight="650" fill="#0f766e" opacity="1"><tspan x="930" dy="0">Scores logged while serving become the rewards used in training</tspan></text>
    <g>
