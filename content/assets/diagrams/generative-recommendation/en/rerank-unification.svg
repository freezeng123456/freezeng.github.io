    <text x="180" y="520.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="180" dy="0">Candidates: dozens</tspan></text>
  </g>
    <text x="180" y="566" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#5e6b7f" opacity="1"><tspan x="180" dy="0">Evaluation collapses to one scalar</tspan></text>

    <g>
    <rect x="375" y="180" width="590" height="425" rx="26" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".22" stroke-width="1.5"/>
