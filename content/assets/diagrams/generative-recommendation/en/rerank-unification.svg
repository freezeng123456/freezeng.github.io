    <text x="180" y="446.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#d97706" opacity="1"><tspan x="180" dy="0">Rule-based assembly</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 180 468 L 180 490" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.199999999999999" stroke-linecap="round" stroke-linejoin="round" />
