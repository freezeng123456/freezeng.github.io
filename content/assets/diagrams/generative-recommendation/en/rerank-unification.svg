    <text x="428" y="519" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="428" dy="0">Sets: the generated unit becomes a set</tspan></text>
    <text x="428" y="542" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="428" dy="0">Each step compresses candidate lists into vectors</tspan><tspan x="428" dy="18">Channel-level rewards favour the set that wins</tspan></text>
  </g>

