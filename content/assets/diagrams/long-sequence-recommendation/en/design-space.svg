<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Five Routes Place the Cost Constraint at Different Points</title>
  <desc id="diagram-desc">The design spectrum moves from reusable user state to candidate-specific event interaction</desc>
  <defs>
