<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">三类信号共同定义 item 效用</title>
  <desc id="diagram-desc">默认相加；也可学习加权。缺少任一信号都会削弱 set-wise 价值对齐</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="684" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="684" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="118" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="113" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="113" dy="0">奖励模型</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">三类信号共同定义 item 效用</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">默认相加；也可学习加权。缺少任一信号都会削弱 set-wise 价值对齐</tspan></text>

    <g filter="url(#shadow)">
    <rect x="70" y="230" width="350" height="170" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="230" width="8" height="170" rx="4" fill="#0f766e"/>
    <circle cx="392" cy="258" r="17" fill="#0f766e"/>
           <text x="392" y="263" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" opacity="1"><tspan x="392" dy="0">1</tspan></text>
    <text x="98" y="273" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="98" dy="0">交互信号 r_a</tspan></text>
    <text x="98" y="293.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="98" dy="0">点赞 / 点击 / 曝光 / 未曝光</tspan><tspan x="98" dy="23">显式行为层级</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="460" y="230" width="350" height="170" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="460" y="230" width="8" height="170" rx="4" fill="#2563eb"/>
    <circle cx="782" cy="258" r="17" fill="#2563eb"/>
           <text x="782" y="263" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" opacity="1"><tspan x="782" dy="0">2</tspan></text>
    <text x="488" y="273" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="488" dy="0">估计分数 r_ŷ</tspan></text>
    <text x="488" y="293.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="488" dy="0">协同模型或 LLM 概率</tspan><tspan x="488" dy="23">潜在相关性</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="850" y="230" width="350" height="170" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="850" y="230" width="8" height="170" rx="4" fill="#d97706"/>
    <circle cx="1172" cy="258" r="17" fill="#d97706"/>
           <text x="1172" y="263" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" opacity="1"><tspan x="1172" dy="0">3</tspan></text>
    <text x="878" y="273" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="878" dy="0">格式相似 r_sim</tspan></text>
    <text x="878" y="293.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="878" dy="0">与正样本共享 token 数</tspan><tspan x="878" dy="23">部分正确性</tspan></text>
  </g>
    <text x="70" y="450" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="800" fill="#5e6b7f" opacity="1"><tspan x="70" dy="0">融合方式</tspan></text>
    <g>
    <rect x="120" y="500" width="250" height="40" rx="20" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28"/>
    <text x="245" y="525.1" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="700" fill="#16865b" opacity="1"><tspan x="245" dy="0">Sum（默认）</tspan></text>
  </g><g>
    <rect x="440" y="500" width="250" height="40" rx="20" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="565" y="525.1" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="565" dy="0">Weighted Sum</tspan></text>
  </g><g>
    <rect x="760" y="500" width="250" height="40" rx="20" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="885" y="525.1" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="885" dy="0">Deep MLP</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="575" width="1140" height="70" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="575" width="8" height="70" rx="4" fill="#4f46e5"/>

    <text x="640" y="615.44" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="640" dy="0">论文默认：R = r_a + r_ŷ + r_sim；Weighted Sum 在 top-5 更稳</tspan></text>

  </g>

</svg>
