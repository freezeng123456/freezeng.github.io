<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Item identifier 生成就是一条 GFlowNet 轨迹</title>
  <desc id="diagram-desc">从空前缀到 L 个 token，逐步拼出可解码的商品标识</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="664" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="664" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="118" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="113" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="113" dy="0">轨迹流</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">Item identifier 生成就是一条 GFlowNet 轨迹</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">从空前缀到 L 个 token，逐步拼出可解码的商品标识</tspan></text>

    <g filter="url(#shadow)">
    <rect x="90" y="250" width="230" height="110" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="90" y="250" width="8" height="110" rx="4" fill="#2563eb"/>

    <text x="205" y="311.12" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="205" dy="0">s₀ = ∅</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="380" y="250" width="230" height="110" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="380" y="250" width="8" height="110" rx="4" fill="#2563eb"/>

    <text x="495" y="311.12" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="495" dy="0">s₁ = ⟨a₂⟩</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="670" y="250" width="230" height="110" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="670" y="250" width="8" height="110" rx="4" fill="#2563eb"/>

    <text x="785" y="311.12" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="785" dy="0">s₂ = ⟨a₂ a₄⟩</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="960" y="250" width="230" height="110" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="960" y="250" width="8" height="110" rx="4" fill="#16865b"/>

    <text x="1075" y="311.12" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1075" dy="0">s₃ = ⟨a₂ a₄ a₁₀⟩</tspan></text>

  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 320 305 L 380 305" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 320 305 L 380 305" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
         <g>
    <rect x="340" y="250" width="96" height="28" rx="14" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="388" y="268.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="388" dy="0">P=0.90</tspan></text>
  </g><g class="flow-connector" opacity="1">
    <path d="M 610 305 L 670 305" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 610 305 L 670 305" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
         <g>
    <rect x="630" y="250" width="96" height="28" rx="14" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="678" y="268.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="678" dy="0">P=0.80</tspan></text>
  </g><g class="flow-connector" opacity="1">
    <path d="M 900 305 L 960 305" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 900 305 L 960 305" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
         <g>
    <rect x="920" y="250" width="96" height="28" rx="14" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="968" y="268.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="968" dy="0">P=0.83</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="90" y="420" width="360" height="90" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="90" y="420" width="8" height="90" rx="4" fill="#4f46e5"/>

    <text x="270" y="470.78" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="270" dy="0">正样本：蓝色 Polo</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="500" y="420" width="360" height="90" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="500" y="420" width="8" height="90" rx="4" fill="#d97706"/>

    <text x="680" y="470.78" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="680" dy="0">增强样本：未曝光商品</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="890" y="420" width="300" height="90" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="890" y="420" width="8" height="90" rx="4" fill="#dc4c64"/>

    <text x="1040" y="470.44" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="1040" dy="0">R(s_L) ∝ 交互价值</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="90" y="545" width="1100" height="78" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="90" y="545" width="8" height="78" rx="4" fill="#16865b"/>

    <text x="640" y="589.44" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="640" dy="0">解码为推荐 item · 目标：P(τ) ∝ R(s_L)，高价值轨迹获得更高生成概率</tspan></text>

  </g>

</svg>
