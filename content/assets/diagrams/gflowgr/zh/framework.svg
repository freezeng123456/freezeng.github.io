<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">三组件把 set-wise 训练接到 token 级监督</title>
  <desc id="diagram-desc">轨迹采样构造候选集合，奖励模型量化效用，GFlowNet 损失对齐生成概率</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="684" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="684" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="118" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="113" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="113" dy="0">GFLOWGR</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">三组件把 set-wise 训练接到 token 级监督</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">轨迹采样构造候选集合，奖励模型量化效用，GFlowNet 损失对齐生成概率</tspan></text>

    <g filter="url(#shadow)">
    <rect x="70" y="210" width="300" height="90" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="210" width="8" height="90" rx="4" fill="#2563eb"/>

    <text x="220" y="261.12" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="220" dy="0">用户提示 U + 正样本 v</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="360" width="300" height="180" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="360" width="8" height="180" rx="4" fill="#0f766e"/>
    <circle cx="342" cy="388" r="17" fill="#0f766e"/>
           <text x="342" y="393" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" opacity="1"><tspan x="342" dy="0">1</tspan></text>
    <text x="98" y="403" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="98" dy="0">轨迹采样器</tspan></text>
    <text x="98" y="412" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="98" dy="0">交互日志 / 随机负样本</tspan><tspan x="98" dy="23">CM 课程采样</tspan><tspan x="98" dy="23">LLM on-policy 采样</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="470" y="360" width="300" height="180" rx="22" fill="#ffffff" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="470" y="360" width="8" height="180" rx="4" fill="#d97706"/>
    <circle cx="742" cy="388" r="17" fill="#d97706"/>
           <text x="742" y="393" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" opacity="1"><tspan x="742" dy="0">2</tspan></text>
    <text x="498" y="403" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="498" dy="0">行为感知奖励</tspan></text>
    <text x="498" y="412" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="498" dy="0">交互信号 r_a</tspan><tspan x="498" dy="23">协同/LLM 分数 r_ŷ</tspan><tspan x="498" dy="23">token 相似 r_sim</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="870" y="360" width="340" height="180" rx="22" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="870" y="360" width="8" height="180" rx="4" fill="#4f46e5"/>
    <circle cx="1182" cy="388" r="17" fill="#4f46e5"/>
           <text x="1182" y="393" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" opacity="1"><tspan x="1182" dy="0">3</tspan></text>
    <text x="898" y="403" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="898" dy="0">GFlowNet 目标</tspan></text>
    <text x="898" y="412" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="898" dy="0">DB 逐步流平衡</tspan><tspan x="898" dy="23">TB 轨迹平衡</tspan><tspan x="898" dy="23">L = L_GR + λ Σ L_GFN</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="470" y="210" width="340" height="90" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="470" y="210" width="8" height="90" rx="4" fill="#16865b"/>

    <text x="640" y="260.44" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="640" dy="0">仅改 LLM 微调；推理链路不变</tspan></text>

  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 370 255 L 460 255" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 370 255 L 460 255" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" />
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 220 300 L 220 348" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 220 300 L 220 348" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 370 450 L 460 450" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 370 450 L 460 450" fill="none" stroke="#d97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)" />
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 770 450 L 860 450" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 770 450 L 860 450" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="580" width="1140" height="72" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="70" y="580" width="8" height="72" rx="4" fill="#dc4c64"/>

    <text x="640" y="621.1" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="750" fill="#14213d" opacity="1"><tspan x="640" dy="0">P_F = P_GR，P_B = 1；终点奖励 R(s_L) 决定整条轨迹流量</tspan></text>

  </g>

</svg>
