    <text x="493" y="248" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="493" dy="0">Flattened Execution</tspan></text>
    <text x="493" y="268.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="493" dy="0">Embedding</tspan><tspan x="493" dy="23">N × Transformer</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="860" y="235" width="270" height="145" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="860" y="235" width="8" height="145" rx="4" fill="#0f766e"/>
    <circle cx="1102" cy="263" r="17" fill="#0f766e"/>
           <text x="1102" y="268" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" opacity="1"><tspan x="1102" dy="0">3</tspan></text>
    <text x="888" y="278" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="888" dy="0">LM Head + Sampler</tspan></text>
    <text x="888" y="298.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="888" dy="0">Gather hidden states</tspan><tspan x="888" dy="23">Produce next-token IDs</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="860" y="470" width="270" height="90" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="860" y="470" width="8" height="90" rx="4" fill="#16865b"/>

    <text x="995" y="522.14" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="995" dy="0">Completed Output</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="465" y="430" width="280" height="115" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="465" y="430" width="8" height="115" rx="4" fill="#d97706"/>

    <text x="605" y="473" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="605" dy="0">KV Block Manager</tspan></text>
    <text x="605" y="505" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="605" dy="0">Allocate · map · reclaim</tspan></text>
  </g>
    <path d="M 340 307 L 455 277" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/>
    <path d="M 745 277 L 850 307" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/>
    <path d="M 995 380 L 995 458" fill="none" stroke="#16865b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)"  opacity="1"/>
    <g>
    <rect x="1012" y="403" width="84" height="28" rx="14" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28"/>
    <text x="1054" y="421.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#16865b" opacity="1"><tspan x="1054" dy="0">finished</tspan></text>
  </g>
    <path d="M 885 258 C 770 120, 300 120, 205 225" fill="none" stroke="#dc4c64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)"  opacity="1"/>
