    <text x="98" y="278" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="98" dy="0">Token Scheduler</tspan></text>
    <text x="98" y="298.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="98" dy="0">Request state</tspan><tspan x="98" dy="23">Token budget</tspan></text>
  </g>
    <g filter="url(#shadow)">
