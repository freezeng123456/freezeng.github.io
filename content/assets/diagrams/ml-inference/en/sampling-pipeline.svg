<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">From Logits to the Next Token</title>
  <desc id="diagram-desc">Constrain the distribution first, then choose a deterministic or stochastic path</desc>
  <defs>
