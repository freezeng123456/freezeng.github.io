    <text x="200" y="305.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="200" dy="0">Interval 1</tspan><tspan x="200" dy="19">zero-initial forced solve</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="375" y="240" width="250" height="145" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="375" y="240" width="8" height="145" rx="4" fill="#0f766e"/>

    <text x="500" y="283" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="750" fill="#14213d" opacity="1"><tspan x="500" dy="0">v2(t)</tspan></text>
    <text x="500" y="305.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="500" dy="0">Interval 2</tspan><tspan x="500" dy="19">zero-initial forced solve</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="675" y="240" width="250" height="145" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="675" y="240" width="8" height="145" rx="4" fill="#4f46e5"/>

    <text x="800" y="283" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="750" fill="#14213d" opacity="1"><tspan x="800" dy="0">v3(t)</tspan></text>
    <text x="800" y="305.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="800" dy="0">Interval 3</tspan><tspan x="800" dy="19">zero-initial forced solve</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="975" y="240" width="250" height="145" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="975" y="240" width="8" height="145" rx="4" fill="#dc4c64"/>

    <text x="1100" y="283" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="750" fill="#14213d" opacity="1"><tspan x="1100" dy="0">v4(t)</tspan></text>
    <text x="1100" y="305.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1100" dy="0">Interval 4</tspan><tspan x="1100" dy="19">zero-initial forced solve</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 305 385 C 375 425, 980 425, 1055 425" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 305 385 C 375 425, 980 425, 1055 425" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" />
  </g><g>
    <rect x="340" y="408" width="150" height="30" rx="15" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="415" y="427.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="415" dy="0">w1(t)</tspan></text>
  </g><g class="flow-connector" opacity="1">
    <path d="M 605 385 C 675 471, 980 471, 1055 471" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 605 385 C 675 471, 980 471, 1055 471" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g><g>
    <rect x="640" y="454" width="150" height="30" rx="15" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="715" y="473.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="715" dy="0">w2(t)</tspan></text>
  </g><g class="flow-connector" opacity="1">
    <path d="M 905 385 C 975 517, 980 517, 1055 517" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 905 385 C 975 517, 980 517, 1055 517" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g><g>
    <rect x="940" y="500" width="150" height="30" rx="15" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="1015" y="519.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="1015" dy="0">w3(t)</tspan></text>
  </g>
    <g>
    <rect x="930" y="405" width="275" height="34" rx="17" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="1067.5" y="426.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="1067.5" dy="0">matrix-exponential tail</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="360" y="560" width="680" height="90" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="360" y="560" width="8" height="90" rx="4" fill="#16865b"/>

    <text x="700" y="603" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="750" fill="#14213d" opacity="1"><tspan x="700" dy="0">u(t) = vⱼ(t) + Σₙ&lt;ⱼ wₙ(t)</tspan></text>
    <text x="700" y="635" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="700" dy="0">Step 2: superpose contributions on the target interval</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 1110 515 C 1030 545, 980 555, 1040 590" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 1110 515 C 1030 545, 980 555, 1040 590" fill="none" stroke="#16865b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)" />
  </g>

</svg>
