    <g>
    <rect x="130" y="535" width="330" height="42" rx="21" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="295" y="560.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb" opacity="1"><tspan x="295" dy="0">Dirichlet: permits outflow</tspan></text>
