<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="630" viewBox="0 0 1400 630" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">From Temporal Locality to Long-Range Memory</title>
  <desc id="diagram-desc">Diffusion, boundaries, and nonlinearity determine how long past information survives</desc>
  <defs>
