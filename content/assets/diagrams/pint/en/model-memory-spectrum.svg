    <text x="535" y="320" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="535" dy="0">phase + damping</tspan><tspan x="535" dy="20">small viscosity preserves paths</tspan></text>
  </g>
