    <rect x="715" y="255" width="8" height="185" rx="4" fill="#d97706"/>

    <text x="865" y="298" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="865" dy="0">Burgers</tspan></text>
    <text x="865" y="320" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="865" dy="0">state-dependent velocity</tspan><tspan x="865" dy="20">shocks regenerate fine scales</tspan></text>
  </g>
