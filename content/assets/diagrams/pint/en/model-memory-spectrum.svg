    <rect x="1045" y="255" width="8" height="185" rx="4" fill="#dc4c64"/>

    <text x="1195" y="298" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="21" font-weight="750" fill="#14213d" opacity="1"><tspan x="1195" dy="0">Wave</tspan></text>
    <text x="1195" y="320" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1195" dy="0">bidirectional propagation</tspan><tspan x="1195" dy="20">amplitude and phase persist</tspan></text>
