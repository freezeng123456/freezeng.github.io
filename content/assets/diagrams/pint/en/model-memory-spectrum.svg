    <text x="205" y="320" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="205" dy="0">high frequencies decay first</tspan><tspan x="205" dy="20">mean and slow modes remain</tspan></text>
