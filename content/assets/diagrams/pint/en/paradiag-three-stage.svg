    <g><rect x="610" y="230" width="300" height="52" rx="16" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".35"/><text x="760" y="263" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#14213d" opacity="1"><tspan x="760" dy="0">shift 1: (d1I − A)x = b</tspan></text></g><g><rect x="610" y="300" width="300" height="52" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".35"/><text x="760" y="333" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#14213d" opacity="1"><tspan x="760" dy="0">shift 2: (d2I − A)x = b</tspan></text></g><g><rect x="610" y="370" width="300" height="52" rx="16" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".35"/><text x="760" y="403" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#14213d" opacity="1"><tspan x="760" dy="0">shift 3: (d3I − A)x = b</tspan></text></g><g><rect x="610" y="440" width="300" height="52" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".35"/><text x="760" y="473" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#14213d" opacity="1"><tspan x="760" dy="0">shift 4: (d4I − A)x = b</tspan></text></g>
