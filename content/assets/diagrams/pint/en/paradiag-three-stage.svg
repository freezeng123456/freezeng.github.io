    <text x="1085" y="328" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1085" dy="0">Inverse time transform</tspan></text>
    <text x="1085" y="360" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1085" dy="0">FFT⁻¹ / V</tspan></text>
