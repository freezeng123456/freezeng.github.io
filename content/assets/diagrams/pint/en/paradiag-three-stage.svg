<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="665" viewBox="0 0 1400 665" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">A Time Transform Splits the All-at-Once System</title>
  <desc id="diagram-desc">The transforms are global; all complex-shifted spatial systems in the middle are concurrent</desc>
  <defs>
