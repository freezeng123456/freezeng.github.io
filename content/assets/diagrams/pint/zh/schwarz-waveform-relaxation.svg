<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">在完整时间窗口上交换界面波形</title>
  <desc id="diagram-desc">每个空间子域独立求解，再用更新后的边界历史驱动下一轮迭代</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8c4d2"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc4c64"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1184" height="594" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1184" height="594" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="333" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="220.5" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="220.5" dy="0">SCHWARZ WAVEFORM RELAXATION</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">在完整时间窗口上交换界面波形</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">每个空间子域独立求解，再用更新后的边界历史驱动下一轮迭代</tspan></text>

    <g>
    <rect x="55" y="210" width="420" height="300" rx="26" fill="#f7faff" stroke="#2563eb" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="55" y="210" width="420" height="52" rx="26" fill="#2563eb" fill-opacity=".1"/>
    <rect x="55" y="236" width="420" height="26" fill="#2563eb" fill-opacity=".1"/>
    <text x="79" y="243" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#2563eb" opacity="1"><tspan x="79" dy="0">子域 1</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="95" y="275" width="340" height="92" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="95" y="275" width="8" height="92" rx="4" fill="#2563eb"/>

    <text x="265" y="326.78" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="265" dy="0">求解完整时间窗口</tspan></text>

  </g>
    <path d="M 135 430 C 170 455, 205 400, 240 430 S 310 452, 345 426" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="250" y="486" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="650" fill="#5e6b7f" opacity="1"><tspan x="250" dy="0">时间窗口</tspan></text>
    <g>
    <rect x="725" y="210" width="420" height="300" rx="26" fill="#f6fcfa" stroke="#0f766e" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="725" y="210" width="420" height="52" rx="26" fill="#0f766e" fill-opacity=".1"/>
    <rect x="725" y="236" width="420" height="26" fill="#0f766e" fill-opacity=".1"/>
    <text x="749" y="243" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="749" dy="0">子域 2</tspan></text>

  </g>
    <g filter="url(#shadow)">
    <rect x="765" y="275" width="340" height="92" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="765" y="275" width="8" height="92" rx="4" fill="#0f766e"/>

    <text x="935" y="326.78" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="935" dy="0">求解完整时间窗口</tspan></text>

  </g>
    <path d="M 805 430 C 840 405, 875 460, 910 430 S 980 408, 1015 434" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <text x="920" y="486" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="650" fill="#5e6b7f" opacity="1"><tspan x="920" dy="0">时间窗口</tspan></text>
    <path d="M 470 285 C 560 230, 645 230, 730 285" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/>
    <g>
    <rect x="515" y="220" width="170" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="600" y="240.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="600" dy="0">界面波形</tspan></text>
  </g>
    <path d="M 730 455 C 645 535, 560 535, 470 455" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)"  opacity="1"/>
    <g>
    <rect x="490" y="520" width="220" height="32" rx="16" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="600" y="540.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="600" dy="0">更新后的界面波形</tspan></text>
  </g>
    <rect x="565" y="300" width="70" height="150" rx="35" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".3"/>
    <text x="600" y="354" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="38" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="600" dy="0">Γ</tspan></text>
    <text x="600" y="405" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="600" dy="0">界面</tspan></text>

</svg>
