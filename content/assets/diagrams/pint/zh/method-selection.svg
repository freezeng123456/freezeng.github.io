    <text x="205" y="635" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="205" dy="0">利用线性与可对角化结构</tspan></text>
  </g>
