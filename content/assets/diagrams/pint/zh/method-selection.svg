    <text x="700" y="248" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="800" fill="#14213d" opacity="1"><tspan x="700" dy="0">问题近似线性？</tspan></text>
  </g>
    <g filter="url(#shadow)">
