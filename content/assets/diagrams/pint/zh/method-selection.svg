    <text x="515" y="603" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="515" dy="0">SWR / Krylov</tspan></text>
    <text x="515" y="635" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="515" dy="0">使用结构感知预条件器</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="745" y="560" width="280" height="115" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="745" y="560" width="8" height="115" rx="4" fill="#0f766e"/>

    <text x="885" y="603" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="885" dy="0">Parareal / PFASST</tspan></text>
    <text x="885" y="635" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="885" dy="0">也可考虑 MGRiT / STMG</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1055" y="560" width="280" height="115" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="1055" y="560" width="8" height="115" rx="4" fill="#dc4c64"/>

    <text x="1195" y="603" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="750" fill="#14213d" opacity="1"><tspan x="1195" dy="0">特征线 / 相位校正</tspan></text>
    <text x="1195" y="635" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1195" dy="0">谨慎使用粗时间网格</tspan></text>
  </g>
