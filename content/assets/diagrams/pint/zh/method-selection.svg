    <rect x="876" y="306" width="58" height="28" rx="14" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="905" y="323.74" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e" opacity="1"><tspan x="905" dy="0">否</tspan></text>
