    <g>
    <rect x="466" y="306" width="58" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="495" y="323.74" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" opacity="1"><tspan x="495" dy="0">是</tspan></text>
  </g>
