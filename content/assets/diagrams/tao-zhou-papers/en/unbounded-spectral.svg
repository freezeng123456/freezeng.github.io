<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Match the Decay of the Basis to the Decay of the Solution</title>
  <desc id="diagram-desc">Solutions of fractional operators decay only algebraically, and the wrong basis destroys spectral accuracy</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="644" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="644" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="223" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="165.5" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="165.5" dy="0">UNBOUNDED DOMAINS</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">Match the Decay of the Basis to the Decay of the Solution</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">Solutions of fractional operators decay only algebraically, and the wrong basis destroys spectral accuracy</tspan></text>

    <g>
    <rect x="40" y="196" width="360" height="246" rx="26" fill="#ffffff" stroke="#2563eb" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="40" y="196" width="360" height="52" rx="26" fill="#2563eb" fill-opacity=".1"/>
    <rect x="40" y="222" width="360" height="26" fill="#2563eb" fill-opacity=".1"/>
    <text x="64" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#2563eb" opacity="1"><tspan x="64" dy="0">Far-field behaviour</tspan></text>

  </g>
    <path d="M 76 410 L 380 410" stroke="#b8c4d2" stroke-width="1.6"/>
    <path d="M 80 410 L 80 268" stroke="#b8c4d2" stroke-width="1.6"/>
    <path d="M 88 274 C 168 306, 240 348, 300 372 S 348 390, 374 394" fill="none" stroke="#dc4c64" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 88 274 C 122 292, 146 384, 196 396 S 300 402, 374 402" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round"/>
    <g>
    <rect x="86" y="416" width="132" height="26" rx="13" fill="#ffffff" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="152" y="432.74" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="152" dy="0">algebraic tail</tspan></text>
  </g>
    <g>
    <rect x="238" y="416" width="142" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="309" y="432.74" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" opacity="1"><tspan x="309" dy="0">Gaussian tail</tspan></text>
  </g>
    <text x="220" y="480" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1"><tspan x="220" dy="0">Criteria for choosing a basis</tspan></text>
    <g>
    <rect x="40" y="502" width="360" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="220" y="525.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="220" dy="0">match the far-field rate</tspan></text>
  </g>
    <g>
    <rect x="40" y="550" width="360" height="38" rx="19" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="220" y="573.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="220" dy="0">keep the operator image integrable</tspan></text>
  </g>
    <g>
    <rect x="40" y="598" width="360" height="38" rx="19" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="220" y="621.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="220" dy="0">keep exploitable stiffness structure</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="430" y="196" width="300" height="168" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="430" y="196" width="8" height="168" rx="4" fill="#2563eb"/>

    <text x="580" y="239" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="580" dy="0">Hermite functions</tspan></text>
    <text x="580" y="261.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="580" dy="0">Gaussian decay suits exponential tails</tspan><tspan x="580" dy="19">and needs a scaling factor</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="430" y="396" width="300" height="168" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="430" y="396" width="8" height="168" rx="4" fill="#dc4c64"/>

    <text x="580" y="439" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="580" dy="0">Rational basis</tspan></text>
    <text x="580" y="461.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="580" dy="0">pulled back by an algebraic map</tspan><tspan x="580" dy="19">so the tail decays algebraically</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="760" y="196" width="300" height="168" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="760" y="196" width="8" height="168" rx="4" fill="#4f46e5"/>

    <text x="910" y="239" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="910" dy="0">Action of the operator</tspan></text>
    <text x="910" y="262.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="910" dy="0">the fractional Laplacian has symbol |ξ| to the 2s</tspan><tspan x="910" dy="17">or a hypersingular integral form</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="760" y="396" width="300" height="168" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="760" y="396" width="8" height="168" rx="4" fill="#0f766e"/>

    <text x="910" y="439" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="910" dy="0">The decisive object</tspan></text>
    <text x="910" y="461.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="910" dy="0">the image of each basis function</tspan><tspan x="910" dy="19">decides if the stiffness is explicit</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1090" y="196" width="280" height="168" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="1090" y="196" width="8" height="168" rx="4" fill="#d97706"/>

    <text x="1230" y="239" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1230" dy="0">Fractional matrix powers</tspan></text>
    <text x="1230" y="262.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1230" dy="0">write the α power of A as a rational</tspan><tspan x="1230" dy="17">function or as a contour integral</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1090" y="396" width="280" height="168" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="1090" y="396" width="8" height="168" rx="4" fill="#16865b"/>

    <text x="1230" y="439" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1230" dy="0">Cost per quadrature node</tspan></text>
    <text x="1230" y="462.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1230" dy="0">each node is one shifted linear solve</tspan><tspan x="1230" dy="17">and the nodes are independent</tspan></text>
  </g>
