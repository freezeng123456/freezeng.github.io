<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Seven Topics on One Technical Spine</title>
  <desc id="diagram-desc">First make randomness approximable, then invert data for unknowns, then make time evolution computable</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="784" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="784" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="168" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="138" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="138" dy="0">RESEARCH MAP</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">Seven Topics on One Technical Spine</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">First make randomness approximable, then invert data for unknowns, then make time evolution computable</tspan></text>

    <g>
    <rect x="30" y="196" width="420" height="466" rx="26" fill="#ffffff" stroke="#2563eb" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="30" y="196" width="420" height="52" rx="26" fill="#2563eb" fill-opacity=".1"/>
    <rect x="30" y="222" width="420" height="26" fill="#2563eb" fill-opacity=".1"/>
    <text x="54" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#2563eb" opacity="1"><tspan x="54" dy="0">turn random input into approximable objects</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="52" y="262" width="376" height="190" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="52" y="262" width="8" height="190" rx="4" fill="#2563eb"/>

    <text x="80" y="305" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="80" dy="0">Stochastic approximation</tspan></text>
    <text x="80" y="318" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="80" dy="0">Galerkin, collocation and least squares</tspan><tspan x="80" dy="19">become one weighted sampling problem</tspan><tspan x="80" dy="19">central object: Christoffel function</tspan></text>
  </g><g>
    <rect x="322" y="276" width="84" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="364" y="293.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="364" dy="0">23 papers</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="52" y="462" width="376" height="190" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="52" y="462" width="8" height="190" rx="4" fill="#16865b"/>

    <text x="80" y="505" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="80" dy="0">Spectral and reduced order</tspan></text>
    <text x="80" y="518" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="80" dy="0">bases on unbounded domains, low-rank</tspan><tspan x="80" dy="19">manifolds, fractional matrix powers</tspan><tspan x="80" dy="19">central object: decay and rank</tspan></text>
  </g><g>
    <rect x="322" y="476" width="84" height="26" rx="13" fill="#ffffff" stroke="#16865b" stroke-opacity=".28"/>
    <text x="364" y="493.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#16865b" opacity="1"><tspan x="364" dy="0">6 papers</tspan></text>
  </g><g>
    <rect x="496" y="196" width="420" height="466" rx="26" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="496" y="196" width="420" height="52" rx="26" fill="#4f46e5" fill-opacity=".1"/>
    <rect x="496" y="222" width="420" height="26" fill="#4f46e5" fill-opacity=".1"/>
    <text x="520" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="520" dy="0">recover unknowns from limited data</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="518" y="262" width="376" height="190" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="518" y="262" width="8" height="190" rx="4" fill="#4f46e5"/>

    <text x="546" y="305" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="546" dy="0">Bayesian inverse problems</tspan></text>
    <text x="546" y="318" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="546" dy="0">surrogate and sampler refine together</tspan><tspan x="546" dy="19">an indicator decides when to solve</tspan><tspan x="546" dy="19">central object: posterior indicator</tspan></text>
  </g><g>
    <rect x="788" y="276" width="84" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="830" y="293.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="830" dy="0">10 papers</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="518" y="462" width="376" height="190" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="518" y="462" width="8" height="190" rx="4" fill="#dc4c64"/>

    <text x="546" y="505" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="546" dy="0">Scientific machine learning</tspan></text>
    <text x="546" y="518" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="546" dy="0">residual losses, density flows, operators</tspan><tspan x="546" dy="19">the sample distribution is the knob</tspan><tspan x="546" dy="19">central object: failure probability</tspan></text>
  </g><g>
    <rect x="788" y="476" width="84" height="26" rx="13" fill="#ffffff" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="830" y="493.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="830" dy="0">22 papers</tspan></text>
  </g><g>
    <rect x="962" y="196" width="408" height="466" rx="26" fill="#ffffff" stroke="#0f766e" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="962" y="196" width="408" height="52" rx="26" fill="#0f766e" fill-opacity=".1"/>
    <rect x="962" y="222" width="408" height="26" fill="#0f766e" fill-opacity=".1"/>
    <text x="986" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="986" dy="0">make time evolution affordable</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="984" y="262" width="364" height="122" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="984" y="262" width="8" height="122" rx="4" fill="#0f766e"/>

    <text x="1012" y="305" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1012" dy="0">FBSDEs and control</tspan></text>
    <text x="1012" y="327.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1012" dy="0">probabilistic representation instead</tspan><tspan x="1012" dy="19">of grids; multistep interpolation</tspan></text>
  </g><g>
    <rect x="1242" y="276" width="84" height="26" rx="13" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="1284" y="293.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="1284" dy="0">22 papers</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="984" y="394" width="364" height="122" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="984" y="394" width="8" height="122" rx="4" fill="#d97706"/>

    <text x="1012" y="437" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1012" dy="0">Phase field and time steps</tspan></text>
    <text x="1012" y="459.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1012" dy="0">discrete energy and quadratic-form</tspan><tspan x="1012" dy="19">positivity for variable-step BDF/IMEX</tspan></text>
  </g><g>
    <rect x="1242" y="408" width="84" height="26" rx="13" fill="#ffffff" stroke="#d97706" stroke-opacity=".28"/>
    <text x="1284" y="425.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706" opacity="1"><tspan x="1284" dy="0">12 papers</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="984" y="526" width="364" height="122" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="984" y="526" width="8" height="122" rx="4" fill="#2563eb"/>

    <text x="1012" y="569" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1012" dy="0">Parallel in time</tspan></text>
    <text x="1012" y="591.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1012" dy="0">diagonalise and precondition the</tspan><tspan x="1012" dy="19">all-at-once space-time operator</tspan></text>
  </g><g>
    <rect x="1242" y="540" width="84" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="1284" y="557.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="1284" dy="0">13 papers</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 456 429 L 490 429" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 456 429 L 490 429" fill="none" stroke="#4f46e5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 922 429 L 956 429" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 922 429 L 956 429" fill="none" stroke="#0f766e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
    <text x="700" y="700" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="800" fill="#14213d" opacity="1"><tspan x="700" dy="0">Three recurring moves</tspan></text>
    <g>
    <rect x="30" y="726" width="420" height="44" rx="22" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="240" y="752.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="240" dy="0">write the sequential or high-dimensional structure as one operator</tspan></text>
  </g>
    <g>
    <rect x="496" y="726" width="420" height="44" rx="22" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="706" y="752.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="706" dy="0">design a weighted, adaptive approximate inverse for it</tspan></text>
  </g>
    <g>
    <rect x="962" y="726" width="408" height="44" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="1166" y="752.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="1166" dy="0">let an error indicator decide where true information is added</tspan></text>
  </g>

</svg>
