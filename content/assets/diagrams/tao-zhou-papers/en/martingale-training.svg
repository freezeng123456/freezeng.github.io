<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Rewrite the Equation Residual as a Martingale Property</title>
  <desc id="diagram-desc">A vanishing residual is equivalent to a martingale; a test network checks it and a value network fixes it</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="684" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="684" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="245" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="176.5" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="176.5" dy="0">MARTINGALE LEARNING</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">Rewrite the Equation Residual as a Martingale Property</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">A vanishing residual is equivalent to a martingale; a test network checks it and a value network fixes it</tspan></text>

    <g filter="url(#shadow)">
    <rect x="40" y="210" width="380" height="170" rx="22" fill="#edf2f7" stroke="#5e6b7f" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="40" y="210" width="8" height="170" rx="4" fill="#5e6b7f"/>

    <text x="230" y="253" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="230" dy="0">Original statement</tspan></text>
    <text x="230" y="275.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="230" dy="0">make the operator residual vanish</tspan><tspan x="230" dy="19">unverifiable on a grid in high dimension</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="40" y="420" width="380" height="170" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="40" y="420" width="8" height="170" rx="4" fill="#0f766e"/>

    <text x="230" y="463" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="230" dy="0">Equivalent statement</tspan></text>
    <text x="230" y="485.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="230" dy="0">build a path process Mₜ</tspan><tspan x="230" dy="19">residual zero ⟺ Mₜ is a martingale</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 230 386 L 230 414" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 230 386 L 230 414" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
    <g>
    <rect x="460" y="196" width="500" height="448" rx="26" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="460" y="196" width="500" height="52" rx="26" fill="#4f46e5" fill-opacity=".1"/>
    <rect x="460" y="222" width="500" height="26" fill="#4f46e5" fill-opacity=".1"/>
    <text x="484" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="484" dy="0">min-max training</tspan></text>

  </g>
    <g>
    <rect x="490" y="596" width="440" height="34" rx="17" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="710" y="617.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="710" dy="0">value and control descend, the test network ascends</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="490" y="266" width="440" height="140" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="490" y="266" width="8" height="140" rx="4" fill="#dc4c64"/>

    <text x="710" y="309" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="710" dy="0">Test network</tspan></text>
    <text x="710" y="331.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="710" dy="0">probes the martingale property</tspan><tspan x="710" dy="19">picks the most violated direction</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="490" y="440" width="440" height="140" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="490" y="440" width="8" height="140" rx="4" fill="#2563eb"/>

    <text x="710" y="483" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="710" dy="0">Value network</tspan></text>
    <text x="710" y="505.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="710" dy="0">minimises the detected violation</tspan><tspan x="710" dy="19">no explicit inf_u H is needed</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 600 410 L 600 436" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 600 410 L 600 436" fill="none" stroke="#dc4c64" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)" />
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 820 436 L 820 410" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 820 436 L 820 410" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="1000" y="266" width="360" height="140" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="1000" y="266" width="8" height="140" rx="4" fill="#d97706"/>

    <text x="1180" y="309" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1180" dy="0">Control network</tspan></text>
    <text x="1180" y="332.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1180" dy="0">updates the feedback control</tspan><tspan x="1180" dy="17">inside the same training loop</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 968 336 L 992 336" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 968 336 L 992 336" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="1000" y="440" width="360" height="140" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="1000" y="440" width="8" height="140" rx="4" fill="#16865b"/>

    <text x="1180" y="483" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1180" dy="0">Why high dimensions work</tspan></text>
    <text x="1180" y="506.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1180" dy="0">every quantity is an expectation</tspan><tspan x="1180" dy="17">along paths, so no grid appears</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 968 510 L 992 510" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 968 510 L 992 510" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" />
  </g>

</svg>
