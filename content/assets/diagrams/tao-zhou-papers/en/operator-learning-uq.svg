    <text x="476" y="587.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#16865b" opacity="1"><tspan x="476" dy="0">the latent gives a mean, the process a covariance</tspan></text>
  </g><g>
