    <text x="895" y="279.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="895" dy="0">evaluates at query points</tspan><tspan x="895" dy="19">combined with coordinate embeddings</tspan></text>
  </g>
