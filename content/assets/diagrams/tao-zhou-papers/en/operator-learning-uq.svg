    <text x="565" y="279.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="565" dy="0">permutation-invariant set encoding</tspan><tspan x="565" dy="19">or a fixed-grid branch network</tspan></text>
