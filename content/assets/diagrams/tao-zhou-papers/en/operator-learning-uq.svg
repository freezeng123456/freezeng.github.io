    <text x="1220" y="279.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1220" dy="0">a value at every query point</tspan><tspan x="1220" dy="19">together with a confidence band</tspan></text>
