<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">多步格式如何提高倒向方程的时间精度</title>
  <desc id="diagram-desc">倒推一步时使用多个已知的未来层，用插值多项式代替被积函数</desc>
