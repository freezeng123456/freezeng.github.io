<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">在低秩流形上直接演化随机解</title>
  <desc id="diagram-desc">基与系数同时随时间变化；规范条件固定了分解的多余自由度</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="744" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="744" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="223" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="165.5" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="165.5" dy="0">LOW-RANK DYNAMICS</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">在低秩流形上直接演化随机解</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">基与系数同时随时间变化；规范条件固定了分解的多余自由度</tspan></text>

    <g filter="url(#shadow)">
    <rect x="40" y="200" width="400" height="168" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="40" y="200" width="8" height="168" rx="4" fill="#2563eb"/>

    <text x="240" y="243" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="240" dy="0">分解形式</tspan></text>
    <text x="240" y="265" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="240" dy="0">u(t,x,ω) ≈ Σ Uᵢ(t,x) Yᵢ(t,ω)</tspan><tspan x="240" dy="20">秩 R 远小于原始自由度</tspan></text>
  </g>
    <g>
    <rect x="480" y="196" width="400" height="320" rx="26" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="480" y="196" width="400" height="52" rx="26" fill="#4f46e5" fill-opacity=".1"/>
    <rect x="480" y="222" width="400" height="26" fill="#4f46e5" fill-opacity=".1"/>
    <text x="504" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="504" dy="0">秩 R 流形</tspan></text>

  </g>
    <path d="M 520 430 C 590 340, 700 486, 838 372" fill="none" stroke="#4f46e5" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="648" cy="404" r="9" fill="#4f46e5"/>
    <text x="648" y="456" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="650" fill="#4f46e5" opacity="1"><tspan x="648" dy="0">当前低秩近似</tspan></text>
    <circle cx="700" cy="300" r="9" fill="#dc4c64"/>
    <text x="738" y="286" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="650" fill="#dc4c64" opacity="1"><tspan x="738" dy="0">真解</tspan></text>
    <g class="flow-connector" opacity="1">
    <path d="M 654 396 L 692 308" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.199999999999999" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 9"/>
    <path d="M 654 396 L 692 308" fill="none" stroke="#dc4c64" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)" stroke-dasharray="6 9"/>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 648 404 L 792 386" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 648 404 L 792 386" fill="none" stroke="#0f766e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
    <text x="770" y="356" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="650" fill="#0f766e" opacity="1"><tspan x="770" dy="0">切空间方向</tspan></text>
    <g filter="url(#shadow)">
    <rect x="920" y="196" width="440" height="152" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="920" y="196" width="8" height="152" rx="4" fill="#0f766e"/>

    <text x="1140" y="239" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1140" dy="0">切空间投影</tspan></text>
    <text x="1140" y="261.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1140" dy="0">把右端投影到切空间</tspan><tspan x="1140" dy="19">得到 U 与 Y 的耦合演化方程</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="920" y="364" width="440" height="152" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="920" y="364" width="8" height="152" rx="4" fill="#d97706"/>

    <text x="1140" y="407" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1140" dy="0">规范条件</tspan></text>
    <text x="1140" y="429.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1140" dy="0">要求基的时间导数与基正交</tspan><tspan x="1140" dy="19">消去分解的旋转自由度</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="40" y="400" width="400" height="152" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="40" y="400" width="8" height="152" rx="4" fill="#16865b"/>

    <text x="240" y="443" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="240" dy="0">误差来源</tspan></text>
    <text x="240" y="465.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="240" dy="0">最佳秩 R 逼近的距离</tspan><tspan x="240" dy="19">加上切空间投影带来的偏离</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="40" y="570" width="400" height="152" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="40" y="570" width="8" height="152" rx="4" fill="#dc4c64"/>

    <text x="240" y="613" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="240" dy="0">退化风险</tspan></text>
    <text x="240" y="635.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="240" dy="0">最小奇异值趋零时曲率变大</tspan><tspan x="240" dy="19">误差常数随之放大</tspan></text>
  </g>
    <text x="700" y="566" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1"><tspan x="700" dy="0">两条缓解路线</tspan></text>
    <g>
    <rect x="490" y="592" width="440" height="44" rx="22" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="710" y="618.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="710" dy="0">自适应调整秩，及时补充新方向</tspan></text>
  </g>
    <g>
    <rect x="950" y="592" width="410" height="44" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="1155" y="618.42" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e" opacity="1"><tspan x="1155" dy="0">对随机方向单独构造演化，减少全局耦合</tspan></text>
  </g>
