    <text x="240" y="466" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#5e6b7f" opacity="1"><tspan x="240" dy="0">训练后的 PINN 在部分区域残差明显偏大</tspan></text>
    <g filter="url(#shadow)">
    <rect x="470" y="200" width="420" height="132" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
