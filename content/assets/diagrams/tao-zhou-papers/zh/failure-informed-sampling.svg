    <text x="1140" y="431" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1140" dy="0">旧点保留或按重采样策略替换</tspan></text>
  </g>
