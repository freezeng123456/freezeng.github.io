    <text x="680" y="399" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="680" dy="0">失效概率</tspan></text>
    <text x="680" y="431" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="680" dy="0">P_F = ∫ 1{ε(y)&gt;阈值} dρ(y)，用采样估计</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="920" y="200" width="440" height="132" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="920" y="200" width="8" height="132" rx="4" fill="#4f46e5"/>

    <text x="1140" y="243" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1140" dy="0">在失效域内取新点</tspan></text>
    <text x="1140" y="275" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1140" dy="0">重要采样或子集模拟给出失效域内的样本</tspan></text>
  </g>
