    <text x="680" y="243" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="680" dy="0">失效事件</tspan></text>
    <text x="680" y="275" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="680" dy="0">定义 {y : ε(y) &gt; 阈值}，其中 ε 为局部残差</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="470" y="356" width="420" height="132" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
