    <text x="361" y="593" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="361" dy="0">触发准则</tspan></text>
    <text x="361" y="625" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="361" dy="0">指标超过阈值即细化；否则继续在代理上采样</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="709" y="550" width="660" height="160" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="709" y="550" width="8" height="160" rx="4" fill="#16865b"/>

    <text x="1039" y="593" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1039" dy="0">去偏保护</tspan></text>
    <text x="1039" y="625" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1039" dy="0">接受率修正或后验加权，防止代理误差直接进入后验</tspan></text>
