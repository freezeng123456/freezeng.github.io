<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">用可逆映射把密度方程写成参数化问题</title>
  <desc id="diagram-desc">解不再是网格上的数值，而是一个把参考密度推前到目标密度的可逆变换</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="784" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="784" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="278" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="193" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="193" dy="0">FLOW-BASED PDE SOLVERS</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">用可逆映射把密度方程写成参数化问题</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">解不再是网格上的数值，而是一个把参考密度推前到目标密度的可逆变换</tspan></text>

    <g filter="url(#shadow)">
    <rect x="40" y="250" width="240" height="166" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="40" y="250" width="8" height="166" rx="4" fill="#2563eb"/>

    <text x="160" y="293" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="160" dy="0">参考密度</tspan></text>
    <text x="160" y="315.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="160" dy="0">标准高斯或均匀分布</tspan><tspan x="160" dy="19">可直接采样</tspan></text>
  </g>
    <g>
    <rect x="500" y="196" width="400" height="268" rx="26" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="500" y="196" width="400" height="52" rx="26" fill="#4f46e5" fill-opacity=".1"/>
    <rect x="500" y="222" width="400" height="26" fill="#4f46e5" fill-opacity=".1"/>
    <text x="524" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="524" dy="0">可逆映射 f_θ</tspan></text>

  </g>
    <rect x="520" y="252" width="72" height="164" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".4"/>
      <text x="556" y="342" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="556" dy="0">L1</tspan></text><rect x="612" y="252" width="72" height="164" rx="16" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".4"/>
      <text x="648" y="342" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="648" dy="0">L2</tspan></text><rect x="704" y="252" width="72" height="164" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".4"/>
      <text x="740" y="342" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="740" dy="0">L3</tspan></text><rect x="796" y="252" width="72" height="164" rx="16" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".4"/>
      <text x="832" y="342" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="832" dy="0">L4</tspan></text>
    <text x="700" y="442" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="650" fill="#5e6b7f" opacity="1"><tspan x="700" dy="0">Jacobian 为三角结构</tspan></text>
    <g class="flow-connector" opacity="1">
    <path d="M 288 333 L 492 333" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 288 333 L 492 333" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="940" y="250" width="420" height="166" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="940" y="250" width="8" height="166" rx="4" fill="#0f766e"/>

    <text x="1150" y="293" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1150" dy="0">推前密度</tspan></text>
    <text x="1150" y="315.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1150" dy="0">p(x) = q(f_θ(x)) · |det ∇f_θ(x)|</tspan><tspan x="1150" dy="19">q 是参考密度，无需归一化常数</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 908 333 L 932 333" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 908 333 L 932 333" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="40" y="496" width="420" height="180" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="40" y="496" width="8" height="180" rx="4" fill="#dc4c64"/>

    <text x="250" y="539" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="250" dy="0">损失来自方程本身</tspan></text>
    <text x="250" y="561.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="250" dy="0">把 p_θ 代入 Fokker-Planck 残差</tspan><tspan x="250" dy="19">在采样点上取平方平均</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="490" y="496" width="420" height="180" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="490" y="496" width="8" height="180" rx="4" fill="#d97706"/>

    <text x="700" y="539" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="700" dy="0">时间方向</tspan></text>
    <text x="700" y="561.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="700" dy="0">把 t 作为条件变量输入</tspan><tspan x="700" dy="19">一次训练覆盖整个时间区间</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="940" y="496" width="420" height="180" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="940" y="496" width="8" height="180" rx="4" fill="#16865b"/>

    <text x="1150" y="539" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="1150" dy="0">有界支撑的处理</tspan></text>
    <text x="1150" y="561.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1150" dy="0">逻辑映射把无界坐标压回区间</tspan><tspan x="1150" dy="19">避免密度泄漏到定义域之外</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 1150 424 C 1150 460, 260 460, 260 490" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 9"/>
    <path d="M 1150 424 C 1150 460, 260 460, 260 490" fill="none" stroke="#dc4c64" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)" stroke-dasharray="6 9"/>
  </g>
    <text x="700" y="716" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1"><tspan x="700" dy="0">两个自动满足的性质</tspan></text>
    <g>
    <rect x="300" y="736" width="340" height="34" rx="17" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="470" y="757.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="470" dy="0">非负性由推前公式保证</tspan></text>
  </g>
    <g>
    <rect x="680" y="736" width="400" height="34" rx="17" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="880" y="757.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="880" dy="0">归一化由变量替换保证</tspan></text>
  </g>

</svg>
