    <text x="416" y="229" text-anchor="end" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#5e6b7f" opacity="1"><tspan x="416" dy="0">每个样本 1 行</tspan></text>
  </g>
    <rect x="72" y="262" width="336" height="11" rx="5" fill="#2563eb" fill-opacity="0.22"/><rect x="72" y="279" width="336" height="11" rx="5" fill="#2563eb" fill-opacity="0.32"/><rect x="72" y="296" width="336" height="11" rx="5" fill="#2563eb" fill-opacity="0.42000000000000004"/><rect x="72" y="313" width="336" height="11" rx="5" fill="#2563eb" fill-opacity="0.22"/>
    <g>
    <rect x="80" y="358" width="320" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="240" y="381.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb" opacity="1"><tspan x="240" dy="0">φ(y⁽ᵐ⁾)ᵀ c ≈ f(y⁽ᵐ⁾)</tspan></text>
  </g>
    <text x="240" y="424" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb" opacity="1"><tspan x="240" dy="0">共 M 行、N 列</tspan></text>
    <g>
    <rect x="40" y="476" width="400" height="252" rx="26" fill="#fffaf0" stroke="#d97706" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="40" y="476" width="400" height="52" rx="26" fill="#d97706" fill-opacity=".1"/>
    <rect x="40" y="502" width="400" height="26" fill="#d97706" fill-opacity=".1"/>
    <text x="64" y="509" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#d97706" opacity="1"><tspan x="64" dy="0">梯度测量</tspan></text>
    <text x="416" y="509" text-anchor="end" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#5e6b7f" opacity="1"><tspan x="416" dy="0">同一样本再加 d 行</tspan></text>
  </g>
    <rect x="72" y="542" width="336" height="11" rx="5" fill="#d97706" fill-opacity="0.22"/><rect x="72" y="559" width="336" height="11" rx="5" fill="#d97706" fill-opacity="0.32"/><rect x="72" y="576" width="336" height="11" rx="5" fill="#d97706" fill-opacity="0.42000000000000004"/><rect x="72" y="593" width="336" height="11" rx="5" fill="#d97706" fill-opacity="0.22"/><rect x="72" y="610" width="336" height="11" rx="5" fill="#d97706" fill-opacity="0.32"/><rect x="72" y="627" width="336" height="11" rx="5" fill="#d97706" fill-opacity="0.42000000000000004"/>
    <g>
    <rect x="80" y="650" width="320" height="38" rx="19" fill="#ffffff" stroke="#d97706" stroke-opacity=".28"/>
    <text x="240" y="673.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#d97706" opacity="1"><tspan x="240" dy="0">∂φ(y⁽ᵐ⁾)ᵀ c ≈ ∂f(y⁽ᵐ⁾)</tspan></text>
  </g>
    <text x="240" y="706" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#d97706" opacity="1"><tspan x="240" dy="0">共 Md 行、N 列</tspan></text>
    <g class="flow-connector" opacity="1">
    <path d="M 448 300 C 480 300, 480 372, 496 372" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 448 300 C 480 300, 480 372, 496 372" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" />
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 448 600 C 480 600, 480 460, 496 460" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 448 600 C 480 600, 480 460, 496 460" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)" />
  </g>
