    <rect x="504" y="340" width="8" height="156" rx="4" fill="#4f46e5"/>

    <text x="699" y="383" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="699" dy="0">堆叠测量矩阵</tspan></text>
    <text x="699" y="405.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="699" dy="0">行数由 M 变为 M(1+d)</tspan><tspan x="699" dy="19">未知量仍是 N 个系数</tspan></text>
  </g>
    <g filter="url(#shadow)">
    <rect x="504" y="196" width="390" height="128" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="504" y="196" width="8" height="128" rx="4" fill="#0f766e"/>

    <text x="699" y="239" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="699" dy="0">预条件与采样密度</tspan></text>
    <text x="699" y="261.5" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="699" dy="0">左乘对角权矩阵</tspan><tspan x="699" dy="19">使各行范数接近一致</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 699 330 L 699 334" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 699 330 L 699 334" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
    <g filter="url(#shadow)">
    <rect x="504" y="552" width="390" height="148" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="504" y="552" width="8" height="148" rx="4" fill="#16865b"/>

    <text x="699" y="595" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="750" fill="#14213d" opacity="1"><tspan x="699" dy="0">ℓ₁ 或加权 ℓ₁ 问题</tspan></text>
    <text x="699" y="616" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="699" dy="0">min ‖c‖₁</tspan><tspan x="699" dy="22">s.t. ‖W(Ac − b)‖₂ ≤ δ</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 699 502 L 699 546" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 699 502 L 699 546" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g>
    <g>
    <rect x="950" y="196" width="410" height="300" rx="26" fill="#fff8f9" stroke="#dc4c64" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="950" y="196" width="410" height="52" rx="26" fill="#dc4c64" fill-opacity=".1"/>
    <rect x="950" y="222" width="410" height="26" fill="#dc4c64" fill-opacity=".1"/>
    <text x="974" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#dc4c64" opacity="1"><tspan x="974" dy="0">有界正交系下的样本复杂度</tspan></text>

  </g>
    <text x="1155" y="330" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="550" fill="#5e6b7f" opacity="1"><tspan x="1155" dy="0">行归一化后落入有界正交系框架</tspan><tspan x="1155" dy="30">s 稀疏恢复所需行数约为 s 乘对数因子</tspan><tspan x="1155" dy="30">行范数越均衡，常数越小</tspan></text>
    <g class="flow-connector" opacity="1">
    <path d="M 902 400 L 942 400" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 902 400 L 942 400" fill="none" stroke="#dc4c64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)" />
  </g>
    <g>
    <rect x="950" y="528" width="410" height="200" rx="26" fill="#f8fbff" stroke="#2563eb" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="950" y="528" width="410" height="52" rx="26" fill="#2563eb" fill-opacity=".1"/>
    <rect x="950" y="554" width="410" height="26" fill="#2563eb" fill-opacity=".1"/>
    <text x="974" y="561" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#2563eb" opacity="1"><tspan x="974" dy="0">每个昂贵样本的信息量</tspan></text>

  </g>
    <text x="1155" y="610" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="550" fill="#5e6b7f" opacity="1"><tspan x="1155" dy="0">一次正问题求解同时给出函数值</tspan><tspan x="1155" dy="30">与全部偏导数，行数放大 (1+d) 倍</tspan><tspan x="1155" dy="30">未知量个数保持不变</tspan></text>
    <g class="flow-connector" opacity="1">
