<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">七个专题共享同一条技术主线</title>
  <desc id="diagram-desc">先把不确定性写成可逼近的对象，再从数据反推参数，最后让时间演化可算</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#b8c4d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#dc4c64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1.5 L 10 6 L 2 10.5" fill="none" stroke="#16865b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="784" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="784" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="168" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="138" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="138" dy="0">RESEARCH MAP</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">七个专题共享同一条技术主线</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">先把不确定性写成可逼近的对象，再从数据反推参数，最后让时间演化可算</tspan></text>

    <g>
    <rect x="30" y="196" width="420" height="466" rx="26" fill="#ffffff" stroke="#2563eb" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="30" y="196" width="420" height="52" rx="26" fill="#2563eb" fill-opacity=".1"/>
    <rect x="30" y="222" width="420" height="26" fill="#2563eb" fill-opacity=".1"/>
    <text x="54" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#2563eb" opacity="1"><tspan x="54" dy="0">把随机输入变成可逼近的对象</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="52" y="262" width="376" height="190" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="52" y="262" width="8" height="190" rx="4" fill="#2563eb"/>

    <text x="80" y="305" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="80" dy="0">随机逼近与配点设计</tspan></text>
    <text x="80" y="318" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="80" dy="0">把 Galerkin、配点与最小二乘</tspan><tspan x="80" dy="19">统一成加权采样问题</tspan><tspan x="80" dy="19">核心量：Christoffel 函数</tspan></text>
  </g><g>
    <rect x="322" y="276" width="84" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="364" y="293.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="364" dy="0">23 篇</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="52" y="462" width="376" height="190" rx="22" fill="#e2f7ec" stroke="#16865b" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="52" y="462" width="8" height="190" rx="4" fill="#16865b"/>

    <text x="80" y="505" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="80" dy="0">谱方法与降阶表示</tspan></text>
    <text x="80" y="518" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="80" dy="0">无界区域基函数、低秩流形</tspan><tspan x="80" dy="19">与分数幂矩阵的快速算法</tspan><tspan x="80" dy="19">核心量：解的衰减与秩</tspan></text>
  </g><g>
    <rect x="322" y="476" width="84" height="26" rx="13" fill="#ffffff" stroke="#16865b" stroke-opacity=".28"/>
    <text x="364" y="493.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#16865b" opacity="1"><tspan x="364" dy="0">6 篇</tspan></text>
  </g><g>
    <rect x="496" y="196" width="420" height="466" rx="26" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="496" y="196" width="420" height="52" rx="26" fill="#4f46e5" fill-opacity=".1"/>
    <rect x="496" y="222" width="420" height="26" fill="#4f46e5" fill-opacity=".1"/>
    <text x="520" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="520" dy="0">从有限数据反推未知量</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="518" y="262" width="376" height="190" rx="22" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="518" y="262" width="8" height="190" rx="4" fill="#4f46e5"/>

    <text x="546" y="305" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="546" dy="0">贝叶斯反问题与数据同化</tspan></text>
    <text x="546" y="318" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="546" dy="0">代理模型与采样器交替细化</tspan><tspan x="546" dy="19">误差指标决定何时补算真解</tspan><tspan x="546" dy="19">核心量：后验误差指标</tspan></text>
  </g><g>
    <rect x="788" y="276" width="84" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="830" y="293.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="830" dy="0">10 篇</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="518" y="462" width="376" height="190" rx="22" fill="#ffe9ed" stroke="#dc4c64" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="518" y="462" width="8" height="190" rx="4" fill="#dc4c64"/>

    <text x="546" y="505" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="546" dy="0">科学机器学习</tspan></text>
    <text x="546" y="518" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="546" dy="0">残差损失、密度流与算子学习</tspan><tspan x="546" dy="19">采样点分布是主要自由度</tspan><tspan x="546" dy="19">核心量：失效概率与频谱</tspan></text>
  </g><g>
    <rect x="788" y="476" width="84" height="26" rx="13" fill="#ffffff" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="830" y="493.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="830" dy="0">22 篇</tspan></text>
  </g><g>
    <rect x="962" y="196" width="408" height="466" rx="26" fill="#ffffff" stroke="#0f766e" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="962" y="196" width="408" height="52" rx="26" fill="#0f766e" fill-opacity=".1"/>
    <rect x="962" y="222" width="408" height="26" fill="#0f766e" fill-opacity=".1"/>
    <text x="986" y="229" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f766e" opacity="1"><tspan x="986" dy="0">让时间演化在有限资源下可算</tspan></text>

  </g><g filter="url(#shadow)">
    <rect x="984" y="262" width="364" height="122" rx="22" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="984" y="262" width="8" height="122" rx="4" fill="#0f766e"/>

    <text x="1012" y="305" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1012" dy="0">FBSDE 与随机最优控制</tspan></text>
    <text x="1012" y="327.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1012" dy="0">用概率表示替代网格离散</tspan><tspan x="1012" dy="19">多步插值提高时间精度</tspan></text>
  </g><g>
    <rect x="1242" y="276" width="84" height="26" rx="13" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="1284" y="293.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="1284" dy="0">22 篇</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="984" y="394" width="364" height="122" rx="22" fill="#fff2d9" stroke="#d97706" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="984" y="394" width="8" height="122" rx="4" fill="#d97706"/>

    <text x="1012" y="437" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1012" dy="0">相场模型与变步长离散</tspan></text>
    <text x="1012" y="459.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1012" dy="0">变步长 BDF 与 IMEX 的</tspan><tspan x="1012" dy="19">离散能量与二次型正定性</tspan></text>
  </g><g>
    <rect x="1242" y="408" width="84" height="26" rx="13" fill="#ffffff" stroke="#d97706" stroke-opacity=".28"/>
    <text x="1284" y="425.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706" opacity="1"><tspan x="1284" dy="0">12 篇</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="984" y="526" width="364" height="122" rx="22" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".28" stroke-width="1.5" />
    <rect x="984" y="526" width="8" height="122" rx="4" fill="#2563eb"/>

    <text x="1012" y="569" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="750" fill="#14213d" opacity="1"><tspan x="1012" dy="0">时间并行算法</tspan></text>
    <text x="1012" y="591.5" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="1012" dy="0">全时间系统的对角化与预条件</tspan><tspan x="1012" dy="19">把串行递推变成并发求解</tspan></text>
  </g><g>
    <rect x="1242" y="540" width="84" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="1284" y="557.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="1284" dy="0">13 篇</tspan></text>
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 456 429 L 490 429" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 456 429 L 490 429" fill="none" stroke="#4f46e5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowIndigo)" />
  </g>
    <g class="flow-connector" opacity="1">
    <path d="M 922 429 L 956 429" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 922 429 L 956 429" fill="none" stroke="#0f766e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)" />
  </g>
    <text x="700" y="700" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="800" fill="#14213d" opacity="1"><tspan x="700" dy="0">三个反复出现的动作</tspan></text>
    <g>
    <rect x="30" y="726" width="420" height="44" rx="22" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="240" y="752.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="240" dy="0">把串行或高维结构写成一个整体算子</tspan></text>
  </g>
    <g>
    <rect x="496" y="726" width="420" height="44" rx="22" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="706" y="752.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="706" dy="0">为该算子设计带权、带自适应的近似逆</tspan></text>
  </g>
    <g>
    <rect x="962" y="726" width="408" height="44" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="1166" y="752.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="1166" dy="0">用误差指标决定在哪里补算真实信息</tspan></text>
  </g>

