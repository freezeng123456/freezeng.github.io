<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">一次 Kernel Launch 如何抵达 SM</title>
  <desc id="diagram-desc">Host 提交通常是异步的；依赖关系或显式同步才让 CPU 等待</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f3faf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9fb0c2" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183153" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8c4d2"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc4c64"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1384" height="734" rx="34" fill="url(#paper)" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="8" y="8" width="1384" height="734" rx="34" fill="url(#dots)"/>
  <g>
    <rect x="54" y="42" width="179" height="32" rx="16" fill="#dff6f1" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="143.5" y="62.76" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e" opacity="1"><tspan x="143.5" dy="0">KERNEL LAUNCH</tspan></text>
  </g>
  <text x="54" y="112" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="800" fill="#14213d" opacity="1"><tspan x="54" dy="0">一次 Kernel Launch 如何抵达 SM</tspan></text>
  <text x="54" y="146" text-anchor="start" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5e6b7f" opacity="1"><tspan x="54" dy="0">Host 提交通常是异步的；依赖关系或显式同步才让 CPU 等待</tspan></text>

    <g>
        <rect x="20" y="200" width="210" height="58" rx="18" fill="#e9f0ff" stroke="#2563eb" stroke-opacity=".3"/>
        <text x="125" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="800" fill="#2563eb" opacity="1"><tspan x="125" dy="0">CPU 应用</tspan></text>
        <line x1="125" y1="270" x2="125" y2="610" stroke="#2563eb" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 8"/>
      </g><g>
        <rect x="300" y="200" width="210" height="58" rx="18" fill="#eeecff" stroke="#4f46e5" stroke-opacity=".3"/>
        <text x="405" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="800" fill="#4f46e5" opacity="1"><tspan x="405" dy="0">Runtime / Driver</tspan></text>
        <line x1="405" y1="270" x2="405" y2="610" stroke="#4f46e5" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 8"/>
      </g><g>
        <rect x="580" y="200" width="210" height="58" rx="18" fill="#e9f0ff" stroke="#dc4c64" stroke-opacity=".3"/>
        <text x="685" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="800" fill="#dc4c64" opacity="1"><tspan x="685" dy="0">Host Queue</tspan></text>
        <line x1="685" y1="270" x2="685" y2="610" stroke="#dc4c64" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 8"/>
      </g><g>
        <rect x="860" y="200" width="210" height="58" rx="18" fill="#eeecff" stroke="#0f766e" stroke-opacity=".3"/>
        <text x="965" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f766e" opacity="1"><tspan x="965" dy="0">GPU Front End</tspan></text>
        <line x1="965" y1="270" x2="965" y2="610" stroke="#0f766e" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 8"/>
      </g><g>
        <rect x="1140" y="200" width="210" height="58" rx="18" fill="#e9f0ff" stroke="#16865b" stroke-opacity=".3"/>
        <text x="1245" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="800" fill="#16865b" opacity="1"><tspan x="1245" dy="0">SMs</tspan></text>
        <line x1="1245" y1="270" x2="1245" y2="610" stroke="#16865b" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 8"/>
      </g>
    <path d="M 125 310 L 397 310" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/>
      <g>
    <rect x="155" y="271" width="220" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity=".28"/>
    <text x="265" y="289.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="1"><tspan x="265" dy="0">launch kernel(grid, block, args)</tspan></text>
  </g>
    <path d="M 405 370 L 677 370" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/>
      <g>
    <rect x="435" y="331" width="220" height="28" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-opacity=".28"/>
    <text x="545" y="349.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" opacity="1"><tspan x="545" dy="0">编码命令并入队</tspan></text>
  </g>
    <path d="M 405 430 L 957 430" fill="none" stroke="#dc4c64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)"  opacity="1"/>
      <g>
    <rect x="575" y="391" width="220" height="28" rx="14" fill="#ffffff" stroke="#dc4c64" stroke-opacity=".28"/>
    <text x="685" y="409.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc4c64" opacity="1"><tspan x="685" dy="0">Doorbell 通知</tspan></text>
  </g>
    <path d="M 965 490 L 693 490" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 8" opacity="1"/>
      <g>
    <rect x="715" y="451" width="220" height="28" rx="14" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="825" y="469.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="825" dy="0">获取并解析命令</tspan></text>
  </g>
    <path d="M 965 550 L 1237 550" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)"  opacity="1"/>
      <g>
    <rect x="995" y="511" width="220" height="28" rx="14" fill="#ffffff" stroke="#0f766e" stroke-opacity=".28"/>
    <text x="1105" y="529.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" opacity="1"><tspan x="1105" dy="0">分发 Thread Blocks</tspan></text>
  </g>
    <path d="M 1245 610 L 973 610" fill="none" stroke="#16865b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 8" opacity="1"/>
      <g>
    <rect x="995" y="571" width="220" height="28" rx="14" fill="#ffffff" stroke="#16865b" stroke-opacity=".28"/>
    <text x="1105" y="589.08" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#16865b" opacity="1"><tspan x="1105" dy="0">Blocks 完成</tspan></text>
  </g>
    <g filter="url(#shadow)">
      <rect x="235" y="655" width="930" height="54" rx="27" fill="#14213d"/>
      <text x="700" y="688" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="1"><tspan x="700" dy="0">CPU 可继续执行，直到遇到依赖或同步点</tspan></text>
    </g>

</svg>
